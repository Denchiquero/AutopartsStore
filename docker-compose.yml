services:

  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: autoparts_store
      POSTGRES_USER: denis
      POSTGRES_PASSWORD: 5252

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build: .

    ports:
      - "8080:8080"

    environment:

      SPRING_PROFILES_ACTIVE: docker

      DB_URL: jdbc:postgresql://postgres:5432/autoparts_store
      DB_USERNAME: denis
      DB_PASSWORD: 5252

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 86400000

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data: